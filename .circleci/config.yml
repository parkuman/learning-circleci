# PIPE-10061 canary: both orbs fail to expand. Before the fix, the compile
# error quotes the marker from the fetched file; after it, it must not.
version: 2.1

orbs:
  scalar: https://raw.githubusercontent.com/parkuman/learning-circleci/main/canary/scalar.yml
  notyaml: https://raw.githubusercontent.com/parkuman/learning-circleci/main/canary/not-yaml.yml

workflows:
  canary:
    jobs:
      - scalar/job
      - notyaml/job
