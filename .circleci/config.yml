version: 2.1

parameters:
  MyParam:
    type: string
    default: "hello"
  camelCaseFlag:
    type: boolean
    default: true
  UPPER_ENUM:
    type: enum
    enum: ["a", "b"]
    default: "a"

jobs:
  show:
    docker:
      - image: cimg/base:current
    steps:
      - run: echo "MyParam=<< pipeline.parameters.MyParam >>"
      - run: echo "camelCaseFlag=<< pipeline.parameters.camelCaseFlag >>"
      - run: echo "UPPER_ENUM=<< pipeline.parameters.UPPER_ENUM >>"

workflows:
  main:
    jobs:
      - show
