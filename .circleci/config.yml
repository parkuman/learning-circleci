# Test: does a restricted context on an approval job gate approval, or is it
# checked when the job unblocks? approval-test-deny always fails (expression).
version: 2.1

jobs:
  echo:
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - run: echo "ran $CIRCLE_JOB"

workflows:
  a-context-on-hold:
    jobs:
      - hold-a:
          type: approval
          context: approval-test-deny
      - echo:
          name: after-a
          requires: [hold-a]
  b-context-downstream:
    jobs:
      - hold-b:
          type: approval
      - echo:
          name: deploy-b
          context: approval-test-deny
          requires: [hold-b]
  c-allow-context-on-hold:
    jobs:
      - hold-c:
          type: approval
          context: approval-test-allow
      - echo:
          name: after-c
          requires: [hold-c]
