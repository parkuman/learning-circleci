version: 2.1

wapodkwdpowakd


parameters:
  bug:
    type: string
    default: "this is buggy"
orbs:
  buggy-orb:
    jobs:
      exhibit-bug:
        docker: [image: "python:2.7"]
        parameters:
          bug:
            type: string
            default: << pipeline.parameters.bug >>
        environment:
          FOO: << parameters.bug >>
        steps:
          - checkout
workflows:
  build-test-deploy:
    jobs:
      - buggy-orb/exhibit-bug
