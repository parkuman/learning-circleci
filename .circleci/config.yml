version: 2.1

setup: true

orbs:
  continuation: circleci/continuation@1

jobs:
  setup-job:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - continuation/continue:
          configuration_path: .circleci/continue_config.yml
          parameters: '{"run-all": true}'

  extra-setup-job:
    docker:
      - image: cimg/base:current
    steps:
      - run:
          name: Extra setup work
          command: echo "This is a second workflow in a setup pipeline - should fail if max-workflows=1 were enforced"

workflows:
  # Workflow 1: the real setup workflow that continues the pipeline
  do-setup:
    jobs:
      - setup-job

  # Workflow 2: this SHOULD be rejected if max-workflows=1 were enforced
  extra-workflow-in-setup:
    jobs:
      - extra-setup-job
