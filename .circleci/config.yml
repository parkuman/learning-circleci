version: 2.1

jobs:
  my-job:
    docker:
      - image: cimg/base:stable
    steps:
      - run: echo "Hello, World!"

workflows:
  my-cool-workflow:
    when:
      matches: { pattern: "/^(?!develop$)(?!build_all$)(?!integration-....?)(?!integration2)(?!fedint-....?)(?!hotfix/.*?/.*$).*/", value: << pipeline.git.branch >> }
    jobs:
      - my-job
